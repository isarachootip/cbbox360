apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cb360-secrets
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  TOTP_ENCRYPTION_KEY: {{ .Values.secrets.totpEncryptionKey | quote }}
  SYSADMIN_INITIAL_PASSWORD: {{ .Values.secrets.sysadminInitialPassword | quote }}
