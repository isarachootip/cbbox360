apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cusbox360
  labels:
    app: cusbox360
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cusbox360
  template:
    metadata:
      labels:
        app: cusbox360
    spec:
      containers:
        - name: cusbox360
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cb360-config
            - secretRef:
                name: {{ .Release.Name }}-cb360-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
