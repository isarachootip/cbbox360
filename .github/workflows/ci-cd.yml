name: CusBox360 Single-Image CI/CD & Multi-Template Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  core-and-architecture:
    name: Core Tests, TypeScript & Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify TypeScript & Vite Production Build
        run: npm run build
      - name: Enforce Zero Industry Coupling in Core
        run: npx vitest run tests/architectureBoundaries.test.ts
      - name: Run Core, Shared & Legacy Regression Tests
        run: npx vitest run core/ server/ src/ shared/ tests/

  module-tests:
    name: Pluggable Modules & CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Domain Module & CLI/Admin API Tests
        run: npx vitest run modules/ scripts/

  template-smoke-matrix:
    name: "Smoke Test Template: ${{ matrix.template }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [hospital, insurance, b2b_wholesale, ecommerce]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate Template YAML Schema
        run: npm run cb360 -- template validate ${{ matrix.template }}
      - name: Provision Tenant & Run Primary Flow Smoke Test
        run: node scripts/smoke-template.js ${{ matrix.template }}

  build-single-image:
    name: Build & Verify Single Multi-Industry Docker Artifact
    runs-on: ubuntu-latest
    needs: [core-and-architecture, module-tests, template-smoke-matrix]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Single CusBox360 Docker Image
        run: docker build -t cusbox360:ci-verify .

      - name: Smoke Verify Single Image Boot & Template CLI Inside Container
        run: |
          docker run --rm cusbox360:ci-verify node scripts/cb360.js template validate
          docker run --rm cusbox360:ci-verify node scripts/smoke-template.js hospital
          docker run --rm cusbox360:ci-verify node scripts/smoke-template.js insurance

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & Push Single Artifact to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag cusbox360:ci-verify "${IMAGE_REPO}:latest"
          docker tag cusbox360:ci-verify "${IMAGE_REPO}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:sha-${GITHUB_SHA::7}"
